* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--fg);
  font: 400 1rem/1.55 var(--f-body);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--fg); text-underline-offset: 3px; }
button, input, textarea { font: inherit; color: inherit; }
h1, h2, h3, p, dl, dd { margin: 0; }

.shell {
  max-width: 1180px;
  margin-left: auto;
  margin-right: auto;
  padding-top: 20px;
  padding-bottom: 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 20px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo { display: block; background: var(--logo) center / contain no-repeat; aspect-ratio: var(--logo-ar); }
.logo-sm { width: 34px; }
.wordmark { font: 800 1.1rem var(--f-display); letter-spacing: .16em; text-transform: uppercase; }
.tag, .eyebrow, .kicker, .lab, .t-tag, .gc, dt, .glabels span {
  font-family: var(--f-mono);
}
.tag { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }

/* progress */
.track { list-style: none; display: flex; gap: 6px; margin: 0; padding: 0; }
.track li { flex: 1; min-width: 0; }
.seg { display: block; width: 100%; padding: 0; background: none; border: 0; text-align: left; cursor: pointer; }
.seg[disabled] { cursor: default; }
.seg:focus-visible { outline: 2px solid var(--fg); outline-offset: 4px; border-radius: 3px; }
.bar { display: block; height: 4px; border-radius: 2px; background: var(--line); transition: background-color .3s; }
.seg.done .bar, .seg.active .bar { background: var(--c); }
.seg.done:not(.active) .bar { opacity: .55; }
.lab { display: block; margin-top: 8px; font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg.active .lab { color: var(--fg); }
.lab b { font-weight: 500; opacity: .7; }
.stepline { display: none; margin-top: 10px; font: 500 .72rem var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
@media (max-width: 820px) {
  .lab { display: none; }
  .stepline { display: block; }
}

/* layout */
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; margin-top: clamp(22px, 4vw, 40px); }
@media (min-width: 1020px) {
  .layout:not(.solo) { grid-template-columns: minmax(0, 1fr) 280px; gap: 48px; }
}
.main { min-width: 0; }
.aside {
  position: sticky; top: 16px; align-self: start;
  padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
}
.layout.solo .aside { display: none; }
@media (max-width: 1019px) { .aside { display: none; } }
.aside dl { display: grid; gap: 14px; margin-top: 14px; }
.aside dt { font-size: .66rem; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin-bottom: 2px; }
.aside dd { font-size: .92rem; line-height: 1.4; overflow-wrap: anywhere; }
.aside dd.empty { color: var(--dim); }

.stage { --hue: var(--h-blue); }
.stage.enter { animation: rise .38s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes rise { from { opacity: .001; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.stage h1:focus, .stage h2:focus { outline: none; }

.eyebrow { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.kicker { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--hue); margin-bottom: 14px; }
.q { font: 700 clamp(1.85rem, 4.6vw, 3rem)/1.05 var(--f-display); letter-spacing: -.015em; text-wrap: balance; margin-bottom: 12px; }
.sub { color: var(--muted); max-width: 62ch; margin-bottom: 28px; }
.sub-h { font: 700 1.25rem var(--f-display); margin: 36px 0 14px; }

/* hero (step 1) */
.hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 64px); align-items: center; }
@media (max-width: 900px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.logo-wrap { position: relative; width: clamp(104px, 15vw, 150px); margin-bottom: 26px; }
.logo-lg { width: 100%; position: relative; z-index: 1; }
.halo {
  position: absolute; inset: -16% -22%;
  background: conic-gradient(from 0deg, var(--h-blue), var(--h-green), var(--h-yellow), var(--h-orange), var(--h-red), var(--h-magenta), var(--h-purple), var(--h-blue));
  filter: blur(26px); opacity: .5; border-radius: 50%;
  -webkit-mask-image: radial-gradient(closest-side, transparent 66%, #000 78%, #000 88%, transparent 100%);
          mask-image: radial-gradient(closest-side, transparent 66%, #000 78%, #000 88%, transparent 100%);
  animation: spin 24s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.hero h1 { font: 800 clamp(2.7rem, 7.2vw, 5.2rem)/.96 var(--f-display); letter-spacing: -.03em; text-wrap: balance; margin: 12px 0 20px; }
.lede { color: var(--muted); font-size: 1.08rem; max-width: 46ch; }
.brands { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); max-width: 46ch; font-size: .88rem; color: var(--dim); }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: clamp(18px, 3vw, 28px); min-width: 0; }
.card h2 { font: 700 clamp(1.4rem, 3vw, 1.85rem)/1.12 var(--f-display); letter-spacing: -.01em; margin: 10px 0 20px; text-wrap: balance; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
.chip {
  padding: 13px 8px; border-radius: 999px; background: transparent; border: 1px solid var(--line-hi);
  font: 600 1rem var(--f-mono); font-variant-numeric: tabular-nums; text-align: center; cursor: pointer; white-space: nowrap;
  transition: background-color .15s, border-color .15s, color .15s;
}
.chip:hover { border-color: var(--muted); }
.chip:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.chip[aria-pressed="true"] { background: var(--hue); border-color: var(--hue); color: var(--ink); }
.chip-wide { font-family: var(--f-body); font-weight: 600; font-size: .92rem; }
.or { display: flex; align-items: center; gap: 14px; margin: 20px 0 12px; font: 500 .7rem var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.money { display: flex; align-items: center; border: 1px solid var(--line-hi); border-radius: 10px; background: var(--ink); transition: border-color .15s, box-shadow .15s; }
.money:focus-within { border-color: var(--hue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--hue) 30%, transparent); }
.money span { padding-left: 16px; font: 500 1.4rem var(--f-mono); color: var(--dim); }
.money input { flex: 1; min-width: 0; background: none; border: 0; outline: none; padding: 14px 16px 14px 6px; font: 600 1.4rem var(--f-mono); font-variant-numeric: tabular-nums; }
.money input::placeholder { color: var(--line-hi); }
.fine { margin-top: 12px; font-size: .82rem; color: var(--dim); }

/* tiles */
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); }
.tiles.big { grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); }
.tiles.sm { grid-template-columns: repeat(auto-fill, minmax(min(100%, 232px), 1fr)); gap: 10px; }
.tile {
  position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 0;
  padding: 16px 46px 16px 18px; text-align: left; cursor: pointer;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  transition: border-color .15s, background-color .15s;
}
.tile:hover { border-color: var(--line-hi); background: var(--panel-hi); }
.tile:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.tile[aria-pressed="true"] { border-color: var(--hue); background: var(--panel-hi); background: color-mix(in srgb, var(--hue) 13%, var(--panel)); }
.tile.sm { padding: 12px 42px 12px 14px; gap: 3px; }
.tile.big { padding: 22px; min-height: 196px; gap: 8px; }
.t-icon { display: block; width: 46px; height: 46px; margin-bottom: 14px; color: var(--hue); }
.t-icon svg { width: 100%; height: 100%; display: block; }
.t-title { font-weight: 700; font-size: 1rem; line-height: 1.25; }
.big .t-title { font: 700 1.35rem/1.1 var(--f-display); }
.t-desc { font-size: .875rem; line-height: 1.45; color: var(--muted); }
.t-tag { font-size: .7rem; color: var(--dim); letter-spacing: .02em; }
.mark { position: absolute; top: 14px; right: 14px; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line-hi); display: grid; place-items: center; transition: background-color .15s, border-color .15s; }
.tile.sm .mark { top: 12px; right: 12px; }
.tile.multi .mark { border-radius: 5px; }
.mark svg { width: 11px; height: 11px; fill: none; stroke: var(--ink); stroke-width: 2.4; opacity: 0; }
.tile[aria-pressed="true"] .mark { background: var(--hue); border-color: var(--hue); }
.tile[aria-pressed="true"] .mark svg { opacity: 1; }

.count { font: 500 .78rem var(--f-mono); letter-spacing: .08em; color: var(--muted); margin: -10px 0 4px; }
.group { margin-top: 30px; }
.gh { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--hue); flex: none; }
.gh h3 { font: 700 1.1rem var(--f-display); }
.gc { margin-left: auto; font-size: .72rem; color: var(--dim); letter-spacing: .08em; }

/* form */
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 640px) { .form { grid-template-columns: minmax(0, 1fr); } }
.f { display: grid; gap: 8px; min-width: 0; }
.f.wide { grid-column: 1 / -1; }
.f > span { font: 500 .7rem var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.f input, .f textarea {
  width: 100%; padding: 13px 14px; background: var(--panel); border: 1px solid var(--line-hi); border-radius: 8px; outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.f textarea { min-height: 128px; resize: vertical; line-height: 1.5; }
.f input:focus, .f textarea:focus { border-color: var(--hue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--hue) 28%, transparent); }

/* nav */
.nav {
  position: sticky; bottom: 0; z-index: 5; display: flex; align-items: center; gap: 14px; margin-top: 36px;
  padding-top: 18px; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--ink) 72%, transparent);
}
.note { flex: 1; min-width: 0; font: 500 .74rem var(--f-mono); letter-spacing: .04em; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 22px; border-radius: 10px;
  font-weight: 700; font-size: .95rem; text-decoration: none; cursor: pointer; border: 1px solid var(--line-hi); background: transparent; color: var(--fg);
  transition: background-color .15s, border-color .15s, opacity .15s;
}
.btn:hover { border-color: var(--muted); }
.btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.btn.primary { background: var(--fg); border-color: var(--fg); color: var(--ink); }
.btn.primary:hover { background: #fff; }
.btn[disabled] { opacity: .32; cursor: not-allowed; }
.btn.sm { padding: 8px 12px; font-size: .82rem; }
.btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; }
@media (max-width: 520px) {
  .note { display: none; }
  .nav { justify-content: space-between; }
}

/* brief page */
.brief { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .brief { grid-template-columns: minmax(0, 1fr); } }
.side { display: grid; gap: 20px; min-width: 0; }
.sheet dl { display: grid; }
.row { display: grid; grid-template-columns: 124px minmax(0, 1fr); gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; padding-top: 0; }
.row:last-child { padding-bottom: 0; }
@media (max-width: 520px) { .row { grid-template-columns: minmax(0, 1fr); gap: 6px; } }
.row dt { font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); padding-top: 3px; }
.row dd { overflow-wrap: anywhere; white-space: pre-wrap; }
.row dd.empty, .dim { color: var(--dim); }
.sg + .sg { margin-top: 14px; }
.sg-t { display: flex; align-items: center; gap: 8px; font-size: .8rem; font-weight: 700; margin-bottom: 8px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { padding: 5px 11px; border: 1px solid var(--line-hi); border-radius: 999px; font-size: .84rem; }
.verdict { font: 700 1.5rem/1.1 var(--f-display); margin: 10px 0 18px; }
.gauge { position: relative; height: 10px; margin: 0 0 8px; }
.zones { position: absolute; inset: 0; border-radius: 5px; opacity: .5; background: linear-gradient(to right, var(--good) 0 var(--z1), var(--warn) var(--z1) var(--z2), var(--bad) var(--z2) 100%); }
.gmark { position: absolute; top: -6px; left: calc(var(--p) * 1%); width: 4px; height: 22px; margin-left: -2px; border-radius: 2px; background: var(--fg); box-shadow: 0 0 0 3px var(--panel); transition: left .5s cubic-bezier(.2, .7, .2, 1); }
.glabels { display: flex; font-size: .64rem; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin-bottom: 16px; }
.glabels span { overflow: hidden; white-space: nowrap; text-overflow: clip; }
.card p + p { margin-top: 10px; }
.card .muted { color: var(--muted); font-size: .92rem; }
.addr { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin: 14px 0 6px; font: 600 1.05rem var(--f-mono); }
.sel { user-select: all; -webkit-user-select: all; overflow-wrap: anywhere; }
.btnrow { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0 8px; }
.note2 { min-height: 1.4em; font-size: .84rem; color: var(--muted); }
.plain { margin-top: 14px; }
.plain summary { cursor: pointer; font: 500 .72rem var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.plain textarea { width: 100%; margin-top: 10px; padding: 12px; background: var(--ink); border: 1px solid var(--line-hi); border-radius: 8px; font: 400 .8rem/1.5 var(--f-mono); color: var(--muted); resize: vertical; }
.links { margin-top: 16px; font-size: .86rem; color: var(--muted); overflow-wrap: anywhere; }
.again { margin-top: 18px; }

.foot { margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--line); font: 400 .74rem var(--f-mono); letter-spacing: .06em; color: var(--dim); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <span class="logo logo-sm" role="img" aria-label="Twinworx logo"></span>

      <div class="nav" id="nav">
        <button type="button" class="btn ghost" id="back">Back</button>
        <p class="note" id="note"></p>
        <button type="button" class="btn primary" id="next"></button>

    <aside class="aside" id="aside" aria-label="Your brief so far"></aside>

    },

    sector: function () {
      return head('What is the project for?', 'Optional. It tells us which sector experience to bring to the work.') +
        '<div class="tiles" role="group" aria-labelledby="qh">' + SECTORS.map(function (o) { return tile('sector', o); }).join('') + '</div>';
    },

    services: function () {
      var groups = GROUPS.map(function (g) {
        var n = g.items.filter(function (i) { return S.services.has(i.id); }).length;
        return '<section class="group" style="--hue:var(' + g.hue + ')" aria-labelledby="g-' + g.id + '">' +
          '<div class="gh"><span class="dot" aria-hidden="true"></span><h3 id="g-' + g.id + '">' + g.t + '</h3><span class="gc" data-gc="' + g.id + '">' + n + ' / ' + g.items.length + '</span></div>' +
          '<div class="tiles sm">' + g.items.map(function (i) { return tile('services', i, 'sm'); }).join('') + '</div></section>';
      }).join('');
      return head('Which services do you need?', 'Select everything that applies. The grey line on each service shows what it is built with.') +
        '<p class="count" id="count" aria-live="polite">' + S.services.size + ' selected</p>' + groups;
    },

    details: function () {
      return head('Timing and contact details', 'Tell us when you need it and where to reply.') +
        '<div class="tiles sm" role="group" aria-label="Timeline">' + TIMELINES.map(function (o) { return tile('timeline', o, 'sm'); }).join('') + '</div>' +
        '<h3 class="sub-h">Who should we reply to?</h3>' +
        '<div class="form">' +
          '<label class="f"><span>Name</span><input id="f-name" type="text" autocomplete="name" value="' + esc(S.name) + '"></label>' +
          '<label class="f"><span>Email</span><input id="f-email" type="email" autocomplete="email" value="' + esc(S.email) + '"></label>' +
          '<label class="f wide"><span>Company (optional)</span><input id="f-company" type="text" autocomplete="organization" value="' + esc(S.company) + '"></label>' +
          '<label class="f wide"><span>Project notes (optional)</span><textarea id="f-notes" placeholder="What is the idea? Add reference links, deadlines or anything we should know.">' + esc(S.notes) + '</textarea></label>' +
        '</div>';
    },

    brief: function () {
      var b = brief(), sc = scope(), text = briefText();
      var row = function (k, v) { return '<div class="row"><dt>' + k + '</dt><dd' + (v ? '' : ' class="empty"') + '>' + (v || 'Not specified') + '</dd></div>'; };
      var svc = b.groups.map(function (x) {
        return '<div class="sg" style="--hue:var(' + x.g.hue + ')"><p class="sg-t"><span class="dot" aria-hidden="true"></span>' + x.g.t + '</p><div class="pills">' +
          x.items.map(function (i) { return '<span class="pill">' + esc(i.t) + '</span>'; }).join('') + '</div></div>';
      }).join('');
      var contact = esc(S.name.trim()) + '\n' + esc(S.email.trim()) + (S.company.trim() ? '\n' + esc(S.company.trim()) : '');

      var gauge;
      if (sc) {
        var z1 = CFG.comfortable / CFG.gaugeMax * 100, z2 = CFG.tight / CFG.gaugeMax * 100;
        gauge = '<div class="card"><p class="eyebrow">Scope against budget</p><h3 class="verdict">' + sc.title + '</h3>' +
          '<div class="gauge" style="--p:' + sc.pos.toFixed(1) + '"><div class="zones" style="--z1:' + z1.toFixed(1) + '%;--z2:' + z2.toFixed(1) + '%"></div><span class="gmark"></span></div>' +
          '<div class="glabels"><span style="flex-basis:' + z1.toFixed(1) + '%">Comfortable</span><span style="flex-basis:' + (z2 - z1).toFixed(1) + '%">Tight</span><span style="flex:1">Ambitious</span></div>' +
          '<p class="muted">' + sc.text + '</p><p class="fine">Indicative guide only, not a quote. Twinworx confirms scope and price.</p></div>';
      } else {
        gauge = '<div class="card"><p class="eyebrow">Scope against budget</p><h3 class="verdict">Budget to be discussed</h3>' +
          '<p class="muted">Twinworx will suggest a scope and a price range once the brief arrives.</p></div>';
      }

      var mail = 'mailto:info@twinworx.uk?subject=' + encodeURIComponent('Project brief from ' + S.name.trim()) + '&body=' + encodeURIComponent(text);

      return head('Your project brief', 'Check the summary, then copy it and send it to Twinworx.') +
        '<div class="brief">' +
          '<div class="card sheet"><dl>' +
            row('Budget', esc(b.budget)) + row('Approach', esc(b.dim)) + row('Formats', esc(b.formats.join(', '))) +
            row('Sector', esc(b.sector)) + row('Timeline', esc(b.timeline)) +
            '<div class="row"><dt>Services</dt><dd>' + svc + '</dd></div>' +
            row('Contact', contact) + row('Notes', esc(S.notes.trim())) +
          '</dl></div>' +
          '<div class="side">' + gauge +
            '<div class="card"><p class="eyebrow">Send it to Twinworx</p>' +
              '<p class="addr"><span class="sel">info@twinworx.uk</span><button type="button" class="btn ghost sm" data-act="copyaddr">Copy address</button></p>' +
              '<p class="muted">Phone <span class="sel">+44 7305 703190</span></p>' +
              '<div class="btnrow"><button type="button" class="btn primary" data-act="copy">Copy brief</button><a class="btn ghost" href="' + mail + '">Open email draft</a></div>' +
              '<p class="note2" id="copyNote" role="status"></p>' +
              '<details class="plain"><summary>Plain-text version</summary><textarea id="briefText" readonly rows="12">' + esc(text) + '</textarea></details>' +
              '<p class="links">See the work: <a href="https://vimeo.com/neilhewitson" target="_blank" rel="noopener">vimeo.com/neilhewitson</a> · <a href="https://www.linkedin.com/in/neilhewitson" target="_blank" rel="noopener">linkedin.com/in/neilhewitson</a></p>' +
              '<button type="button" class="btn ghost again" data-act="restart">Start again</button>' +
            '</div>' +
          '</div>' +
        '</div>';
    }
  };

  /* ---------- Brief data ---------- */
  function brief() {
    var dim = find(DIMS, S.dim), sec = find(SECTORS, S.sector), tl = find(TIMELINES, S.timeline);
    return {
      budget: budgetLabel(),
      dim: dim ? dim.t : '',
      formats: FORMATS.filter(function (f) { return S.formats.has(f.id); }).map(function (f) { return f.t; }),
      sector: sec ? sec.t : '',
      timeline: tl ? tl.t + (tl.d ? ' (' + tl.d.toLowerCase() + ')' : '') : '',
      groups: GROUPS.map(function (g) {
        return { g: g, items: g.items.filter(function (i) { return S.services.has(i.id); }) };
      }).filter(function (x) { return x.items.length; })
    };
  }

  function briefText() {
    var b = brief(), L = [];
    L.push('TWINWORX PROJECT BRIEF', '');
    L.push('Budget: ' + (b.budget || 'Not specified'));
    L.push('Approach: ' + (b.dim || 'Not specified'));
    L.push('Formats: ' + (b.formats.join(', ') || 'Not specified'));
    L.push('Sector: ' + (b.sector || 'Not specified'));
    L.push('Timeline: ' + (b.timeline || 'Not specified'));
    L.push('', 'Services:');
    b.groups.forEach(function (x) { L.push('- ' + x.g.t + ': ' + x.items.map(function (i) { return i.t; }).join(', ')); });
    L.push('', 'Contact: ' + S.name.trim() + ' <' + S.email.trim() + '>' + (S.company.trim() ? ' (' + S.company.trim() + ')' : ''));
    if (S.notes.trim()) L.push('', 'Notes:', S.notes.trim());
    var sc = scope();
    if (sc) L.push('', 'Scope against budget: ' + sc.plain + ' (indicative guide only, not a quote)');
    return L.join('\n');
  }

  function scope() {
    if (typeof S.budget !== 'number') return null;
    var pts = 0;
    GROUPS.forEach(function (g) { g.items.forEach(function (i) { if (S.services.has(i.id)) pts += i.w; }); });
    pts += Math.max(0, S.formats.size - 1);
    FORMATS.forEach(function (f) { if (S.formats.has(f.id) && f.w) pts += f.w; });
    var d = find(DIMS, S.dim); if (d) pts += d.w;
    var t = find(TIMELINES, S.timeline); if (t) pts += t.w;
    var ratio = pts / (S.budget / CFG.poundsPerPoint);
    var pos = Math.max(2, Math.min(98, ratio / CFG.gaugeMax * 100));
    if (ratio <= CFG.comfortable) return { pos: pos, title: 'Comfortable fit', plain: 'Comfortable fit', text: 'The scope you chose sits well within this budget.' };
    if (ratio <= CFG.tight) return { pos: pos, title: 'Tight but workable', plain: 'Tight but workable', text: 'This can work with a focused scope. Twinworx will confirm exactly what is included.' };
    return { pos: pos, title: 'Ambitious for this budget', plain: 'Ambitious for this budget', text: 'Consider trimming a few services or raising the budget. Twinworx will advise on the best route.' };
  }

  /* ---------- Chrome: tracker, aside, nav ---------- */
  function renderTrack() {
    $('#track').innerHTML = STEPS.map(function (s, i) {
      var cls = i === S.step ? 'active' : (i <= S.max ? 'done' : '');
      return '<li><button type="button" class="seg ' + cls + '" style="--c:var(' + s.hue + ')" data-go="' + i + '"' + (i > S.max ? ' disabled' : '') + (i === S.step ? ' aria-current="step"' : '') + '>' +
        '<span class="bar"></span><span class="lab"><b>0' + (i + 1) + '</b> ' + s.label + '</span></button></li>';
    }).join('');
    $('#stepline').textContent = 'Step ' + (S.step + 1) + ' of ' + STEPS.length + ' · ' + STEPS[S.step].label;
  }

  function renderAside() {
    var b = brief();
    var svcN = S.services.size;
    var rows = [
      ['Budget', b.budget],
      ['Approach', b.dim],
      ['Formats', b.formats.join(', ')],
      ['Sector', b.sector],
      ['Services', svcN ? svcN + ' selected' : ''],
      ['Timeline', b.timeline]
    ];
    $('#aside').innerHTML = '<p class="eyebrow">Your brief so far</p><dl>' + rows.map(function (r) {
      return '<div><dt>' + r[0] + '</dt><dd' + (r[1] ? '' : ' class="empty"') + '>' + (r[1] ? esc(r[1]) : 'Not chosen yet') + '</dd></div>';
    }).join('') + '</dl>';
    $('#layout').classList.toggle('solo', S.step === 0 || S.step === STEPS.length - 1);
  }

  function canNext() {
    switch (STEPS[S.step].id) {
      case 'budget':   return S.budget === 'unsure' || (typeof S.budget === 'number' && S.budget > 0);
      case 'style':    return !!S.dim;
      case 'format':   return S.formats.size > 0;
      case 'services': return S.services.size > 0;
      case 'details':  return S.name.trim().length > 1 && /^\S+@\S+\.\S+$/.test(S.email.trim());
      default:         return true;
    }
  }

  function miniSummary() {
    var b = brief(), p = [];
    if (b.budget) p.push(b.budget);
    if (b.dim) p.push(b.dim);
    if (S.formats.size) p.push(S.formats.size + (S.formats.size === 1 ? ' format' : ' formats'));
    if (S.services.size) p.push(S.services.size + (S.services.size === 1 ? ' service' : ' services'));
    return p.join(' · ');
  }

  function renderNav() {
    var id = STEPS[S.step].id, ok = canNext();
    backBtn.style.visibility = S.step === 0 ? 'hidden' : 'visible';
    nextBtn.hidden = id === 'brief';
    nextBtn.disabled = !ok;
    var label = id === 'sector' ? (S.sector ? 'Continue' : 'Skip') : id === 'details' ? 'Review brief' : 'Continue';
    nextBtn.innerHTML = label + ARROW;
    note.textContent = ok ? miniSummary() : (HINTS[id] || '');
  }

  function chrome() { renderAside(); renderNav(); }

  function render(navigated) {
    var st = STEPS[S.step];
    stage.style.setProperty('--hue', 'var(' + st.hue + ')');
    stage.innerHTML = VIEWS[st.id]();
    stage.classList.remove('enter'); void stage.offsetWidth; stage.classList.add('enter');
    renderTrack(); chrome();
    if (navigated) {
      window.scrollTo(0, 0);
      var h = stage.querySelector('#qh');
      if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); }
    }
  }

  /* ---------- Interaction ---------- */
  function updateCounts() {
    var c = $('#count'); if (c) c.textContent = S.services.size + ' selected';
    GROUPS.forEach(function (g) {
      var el = stage.querySelector('[data-gc="' + g.id + '"]');
      if (el) el.textContent = g.items.filter(function (i) { return S.services.has(i.id); }).length + ' / ' + g.items.length;
    });
  }

  function pick(btn) {
    var k = btn.dataset.kind, id = btn.dataset.id;
    if (S[k] instanceof Set) { if (S[k].has(id)) S[k].delete(id); else S[k].add(id); }
    else S[k] = ((k === 'sector' || k === 'timeline') && S[k] === id) ? null : id;
    stage.querySelectorAll('.tile[data-kind="' + k + '"]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(isSel(k, b.dataset.id)));
    });
    if (k === 'services') updateCounts();
    chrome();
  }

  function syncChips() {
    stage.querySelectorAll('[data-budget]').forEach(function (c) {
      var v = c.dataset.budget;
      c.setAttribute('aria-pressed', String(v === 'unsure' ? S.budget === 'unsure' : S.budget === +v));
    });
  }

  function setBudget(v) {
    var input = $('#budgetInput');
    if (v === 'unsure') { S.budget = 'unsure'; S.budgetInput = ''; S.budgetPlus = false; }
    else { S.budget = +v; S.budgetInput = (+v).toLocaleString('en-GB'); S.budgetPlus = (+v >= 10000); }
    if (input) input.value = S.budgetInput;
    syncChips(); chrome();
  }

  function copyText(text, el) {
    var done = function (msg) { if (el) el.textContent = msg; };
    var fallback = function () {
      var ta = $('#briefText');
      if (ta) { var d = ta.closest('details'); if (d) d.open = true; ta.focus(); ta.select(); }
      done('Copy was blocked here. The text is selected, so press Ctrl+C or Cmd+C.');
    };
    try {
      navigator.clipboard.writeText(text).then(function () { done('Copied to clipboard.'); }, fallback);
    } catch (e) { fallback(); }
  }

  stage.addEventListener('click', function (e) {
    var t = e.target.closest('.tile');
    if (t) { pick(t); return; }
    var c = e.target.closest('[data-budget]');
    if (c) { setBudget(c.dataset.budget); return; }
    var a = e.target.closest('[data-act]');
    if (!a) return;
    var act = a.dataset.act;
    if (act === 'copy') copyText(briefText(), $('#copyNote'));
    else if (act === 'copyaddr') copyText('info@twinworx.uk', $('#copyNote'));
    else if (act === 'restart') { S = fresh(); render(true); }
  });

  stage.addEventListener('input', function (e) {
    var t = e.target, id = t.id;
    if (id === 'budgetInput') {
      var digits = t.value.replace(/\D/g, '').slice(0, 7);
      if (digits !== t.value) t.value = digits;
      S.budgetInput = digits;
      S.budget = digits && +digits > 0 ? +digits : null;
      S.budgetPlus = false;
      syncChips(); chrome();
    } else if (id === 'f-name') { S.name = t.value; renderNav(); }
    else if (id === 'f-email') { S.email = t.value; renderNav(); }
    else if (id === 'f-company') { S.company = t.value; }
    else if (id === 'f-notes') { S.notes = t.value; }
  });

  stage.addEventListener('focusout', function (e) {
    if (e.target.id === 'budgetInput' && typeof S.budget === 'number') {
      S.budgetInput = S.budget.toLocaleString('en-GB');
      e.target.value = S.budgetInput;
    }
  });

  $('#track').addEventListener('click', function (e) {
    var b = e.target.closest('[data-go]');
    if (!b || b.disabled) return;
    var i = +b.dataset.go;
    if (i !== S.step) { S.step = i; render(true); }
  });

  nextBtn.addEventListener('click', function () {
    if (!canNext()) return;
    S.step = Math.min(S.step + 1, STEPS.length - 1);
    S.max = Math.max(S.max, S.step);
    render(true);
  });
  backBtn.addEventListener('click', function () {
    if (S.step > 0) { S.step--; render(true); }
  });

  render(false);
})();
</script>

</body>
</html>
